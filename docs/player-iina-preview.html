<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AFMC FIND · 播放器交互预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#fafafa;font:14px "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(94vw,1140px)}header{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 16px;color:#bfc1c7}strong{letter-spacing:.08em;color:white}section{position:relative;isolation:isolate;width:100%;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(ellipse at 64% 45%,#283140 0,#141c29 34%,#070a0e 75%);border-radius:12px;box-shadow:0 20px 80px #0007}section:fullscreen{border-radius:0;width:100vw;height:100vh}canvas{position:absolute;width:100%;height:100%}.planet{position:absolute;left:-5%;top:42%;width:130%;aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 55% 1%,#4c4c52,#23272f 9%,#0b0f15 24%,#050608 50%);box-shadow:0 -2px 4px #fff8,0 -5px 13px #e8aba591,0 -18px 60px #d3846b36;transform:rotate(-13deg)}.caption{position:absolute;top:20px;left:24px;text-shadow:0 1px 5px black}.dock,aside{background:#22242bcf;backdrop-filter:blur(22px);border:1px solid #ffffff25;box-shadow:0 7px 24px #0006}.dock{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:min(460px,88%);border-radius:14px;padding:10px 17px 13px}.controls,.track{display:flex;align-items:center;justify-content:space-between;gap:8px}.track{font-size:11px;font-variant-numeric:tabular-nums;color:#c9cbd0}.controls{margin:0 0 8px}button{color:white;background:transparent;border:0;border-radius:6px;min-height:34px;padding:3px 9px;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#ffffff22}#play{font-size:21px}input{accent-color:#ff5288;min-width:0}#seek{width:100%}#vol{width:52px}aside{position:absolute;right:14px;top:14px;bottom:14px;width:min(240px,60%);padding:20px;border-radius:10px}aside button{display:block;width:100%;text-align:left;margin:8px 0}aside p{color:#bfc1c7}footer{color:#a1a3aa;margin-top:16px;font-size:13px}.caption,.dock{transition:opacity .18s}.quiet .caption,.quiet .dock{opacity:0;pointer-events:none}.quiet{cursor:none}.quiet:focus-within .dock:has(:focus-visible){opacity:1;pointer-events:auto}</style>
<main><header><strong>AFMC FIND</strong><span>播放器交互预览</span></header><section id="stage" tabindex="0"><canvas id="stars"></canvas><div class="planet"></div><span class="caption">轨道 · 动态演示</span><div class="dock"><div class="controls"><div><button id="mute" aria-label="静音">音量</button><input type="range" id="vol" value="70" aria-label="音量"></div><div><button id="back" aria-label="后退十秒">↶</button><button id="play" aria-label="暂停或播放">Ⅱ</button><button id="next" aria-label="前进十秒">↷</button></div><div><button id="cc">字幕</button><button id="fs" aria-label="全屏">⛶</button></div></div><div class="track"><span id="now"></span><input type="range" id="seek" max="600" value="84" aria-label="进度"><span>10:00</span></div></div><aside hidden><strong>字幕</strong><p>演示字幕轨</p><button data-track="关闭">关闭</button><button data-track="简体中文">简体中文</button><button id="dismiss">收起 ›</button></aside><span id="line" style="position:absolute;bottom:30%;width:100%;text-align:center;pointer-events:none"></span></section><footer>移动鼠标唤出控制栏 · 空格暂停 · 双击画面全屏 · Esc 返回</footer></main>
<script>const $=s=>document.querySelector(s), stage=$('#stage'),panel=$('aside'),seek=$('#seek');let playing=true,n=84,timeout,sub=false;function wake(){stage.classList.remove('quiet');clearTimeout(timeout);if(playing&&panel.hidden)timeout=setTimeout(()=>{if(!$('.dock').matches(':hover'))stage.classList.add('quiet')},2400)}function display(){seek.value=n;$('#now').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');$('#line').textContent=sub?'我们正在越过晨昏线。':'';const c=$('#stars');c.width=1000;c.height=560;const x=c.getContext('2d');for(let i=1;i<=115;i++){x.fillStyle='rgba(230,236,245,'+(0.18+(i%7)/10)+')';x.fillRect((i*131.419+n*.16)%1000,(i*i*13.37)%560,i%3?1:2,1)}}function toggle(){playing=!playing;$('#play').textContent=playing?'Ⅱ':'▶';wake()}function full(){document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();wake()}$('#fs').onclick=full;stage.ondblclick=e=>{if(!e.target.closest('.dock,aside'))full()};stage.onpointermove=wake;stage.onfocusin=wake;$('#play').onclick=toggle;seek.oninput=()=>{n=+seek.value;display()};$('#back').onclick=()=>{n=Math.max(0,n-10);display()};$('#next').onclick=()=>{n=Math.min(600,n+10);display()};$('#mute').onclick=()=>$('#vol').value=+$('#vol').value?0:70;$('#cc').onclick=()=>{panel.hidden=!panel.hidden;wake()};$('#dismiss').onclick=()=>{panel.hidden=true;wake()};panel.onclick=e=>{if(e.target.dataset.track){sub=e.target.dataset.track!=='关闭';panel.hidden=true;display();wake()}};document.onkeydown=e=>{if(e.code==='Space'&&!e.target.matches('button,input')){e.preventDefault();toggle()}if(e.key==='Escape'){panel.hidden=true;wake()}};setInterval(()=>{if(playing){n=(n+1)%601;display()}},1000);display();wake()</script></html>
