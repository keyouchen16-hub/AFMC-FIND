<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=(name)=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const art=(variant=0)=>`<svg viewBox="0 0 300 170" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="170" fill="${variant===1?'#3d3545':variant===2?'#263a48':'#2d403e'}"/><circle cx="225" cy="42" r="22" fill="${variant===1?'#b99c91':'#c9c3a2'}" opacity=".76"/><path d="M0 136 72 55 125 108 173 76 300 157V170H0Z" fill="${variant===1?'#776578':'#617470'}"/><path d="m40 92 32-37 29 29-20-8-11 5-10-1Z" fill="#c0c4b4" opacity=".6"/><path d="M-20 173 105 86 173 146 225 100 330 173Z" fill="${variant===1?'#463e53':'#344d49'}"/><path d="M0 173 76 145 159 164 235 137 300 155V180Z" fill="#182b2b"/><path d="m111 119 11-9 5 5-8-1Z" fill="#b4bca9" opacity=".35"/></svg>`;
const rows=[
 {id:1,title:'远山 · Far Horizon',variant:'2025 · 1080p · H.264',source:'Northlight',size:2.4,date:'2025-09-18',seeds:1280,state:'ready',resolution:'1080p',category:'video',cover:true,edition:'剧场版',codec:'H.264 / AAC',file:'Far.Horizon.2025.1080p.BluRay.H264.AAC.DEMO.mkv'},
 {id:2,title:'远山 · Far Horizon',variant:'2025 · 4K · H.265',source:'Open Frames',size:8.6,date:'2025-10-02',seeds:642,state:'data',resolution:'4K',category:'video',cover:true,edition:'导演剪辑版',codec:'H.265 / FLAC',file:'Far.Horizon.2025.Directors.Cut.2160p.H265.DEMO.mkv'},
 {id:3,title:'远山 · Far Horizon',variant:'2025 · 1080p · H.265',source:'Northlight',size:1.8,date:'2025-09-22',seeds:386,state:'unknown',resolution:'1080p',category:'video',cover:true,edition:'剧场版',codec:'H.265 / AAC',file:'Far.Horizon.2025.1080p.H265.AAC.DEMO.mp4'},
 {id:4,title:'远山 · Far Horizon',variant:'2025 · 720p · H.264',source:'Archive Studio',size:1.1,date:'2025-08-30',seeds:194,state:'unknown',resolution:'720p',category:'video',cover:true,edition:'剧场版',codec:'H.264 / AAC',file:'Far.Horizon.2025.720p.H264.DEMO.mp4'},
 {id:5,title:'远山：幕后与制作手记',variant:'2025 · 1080p · 纪录短片',source:'Open Frames',size:.85,date:'2025-10-06',seeds:72,state:'unknown',resolution:'1080p',category:'video',cover:false,edition:'幕后短片',codec:'H.264 / AAC',file:'Far.Horizon.Behind.The.Scenes.1080p.DEMO.mp4'},

];
const labels={ready:'已验证起播',data:'已有数据',unknown:'未验证',checking:'检测中',failed:'本次超时'};
let selected=1, mode='ready', committedQuery='远山', sortField=null, ascending=false, sizeFilter='all', liveOnly=false, toastTimer, returnFocus=null;
const effectiveState=r=>r.category!=='video'?'unknown':mode==='unverified'&&r.state==='ready'?'unknown':mode==='checking'&&r.id===1?'checking':mode==='checking'&&r.state==='ready'?'unknown':r.state;
const sizeText=r=>r.size<1?`${Math.round(r.size*1024)} MB`:`${r.size.toFixed(1)} GB`;
function filtered(){if(mode==='empty')return [];let list=rows.filter(r=>(r.title+' '+r.file).toLowerCase().includes(committedQuery.toLowerCase()));const cat=$('#category-filter').value,res=$('#resolution-filter').value;list=list.filter(r=>(cat==='all'||r.category===cat)&&(res==='all'||r.resolution===res)&&(!liveOnly||r.seeds>0)&&(sizeFilter==='all'||sizeFilter==='small'&&r.size<1||sizeFilter==='medium'&&r.size>=1&&r.size<=10||sizeFilter==='large'&&r.size>10));if(sortField)list.sort((a,b)=>(typeof a[sortField]==='string'?a[sortField].localeCompare(b[sortField]):a[sortField]-b[sortField])*(ascending?1:-1));return list;}
function render(){const list=filtered();if(!list.some(r=>r.id===selected))selected=list[0]?.id??null;$('#result-count').textContent=`${list.length} 条结果`;const ready=list.filter(r=>effectiveState(r)==='ready').length;const summary=$('#availability-summary');summary.className='summary-state'+(!ready?(mode==='checking'?' checking':' unknown'):'');summary.textContent=mode==='checking'?'正在验证起播':ready?`${ready} 条已验证起播`:'暂无已验证可播';$('#footer-status').textContent=mode==='checking'?'正在检测示例资源 · 演示不会连接网络':`搜索完成 · 示例来源 ${new Set(list.map(r=>r.source)).size} 个`;$('#result-list').innerHTML=list.length?list.map(r=>{const state=effectiveState(r);return `<button class="result-row ${r.id===selected?'selected':''}" id="result-${r.id}" role="option" aria-selected="${r.id===selected}" data-row="${r.id}"><span class="result-name">${r.cover?`<span class="poster">${art(r.category==='music'?1:0)}</span>`:''}<span class="result-copy"><span class="result-title">${r.title}</span><span class="result-meta">${r.source}<span class="meta-dot">·</span>${r.variant}</span></span></span><span class="state-cell"><span class="state-badge ${state}">${state==='ready'||state==='checking'?'<span class="status-dot"></span>':''}${r.category==='video'?labels[state]:'—'}</span></span><span class="number">${sizeText(r)}</span><span class="number date">${r.date}</span><span class="number seeds">${r.seeds.toLocaleString('en-US')}</span></button>`}).join(''):`<div class="empty">${icon('search')}<strong>没有找到匹配结果</strong><p>试试更简短的关键词，或放宽筛选。<br>本预览仅包含「远山 / Far Horizon」示例。</p><button class="quiet-button" id="reset-demo">重置示例</button></div>`;$$('[data-row]').forEach(b=>{b.onclick=()=>{selected=Number(b.dataset.row);render()};b.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const i=list.findIndex(r=>r.id===selected),next=list[Math.max(0,Math.min(list.length-1,i+(e.key==='ArrowDown'?1:-1)))];selected=next.id;render();$(`#result-${selected}`).focus()}}});$('#reset-demo')?.addEventListener('click',reset);renderDetail();}
function renderDetail(){const r=rows.find(r=>r.id===selected),panel=$('#detail-panel');if(!r){panel.innerHTML='<div class="detail-kicker">资源详情</div><div class="empty-detail">选中资源后，在这里查看详情</div>';return;}const state=effectiveState(r),ready=state==='ready',video=r.category==='video';panel.innerHTML=`<div class="detail-scroll"><div class="detail-kicker"><span>资源详情</span><span>虚构内容 · DEMO</span></div>${r.cover?`<div class="hero-art">${art(r.category==='music'?1:0)}<div class="hero-wordmark">FAR HORIZON<span class="hero-subtitle">AN IMAGINARY JOURNEY</span></div></div>`:''}<h1>${r.id===5?'远山：幕后手记':r.id===6?'远山 · 原声音乐':r.id===7?'远山 · 视觉设定集':'远山'}</h1><p class="subtitle">Far Horizon · 2025 · ${r.edition}</p><div class="detail-evidence ${ready?'':'unknown'}">${icon(ready?'check':'info')}<div>${video?(ready?'示例状态：已验证起播':state==='data'?'已有数据，播放尚未确认':state==='checking'?'正在检查是否能够起播':state==='failed'?'本次连接超时':'尚未验证播放'):'此资源适合交给下载软件下载'}<div class="note">${ready?'起播成功不保证全片持续流畅。':'演示信息，不代表真实资源可用性。'}</div></div></div><div class="detail-grid"><div class="field"><label>文件大小</label><span>${sizeText(r)}</span></div><div class="field"><label>规格</label><span>${r.resolution||r.codec}</span></div><div class="field"><label>来源</label><span>${r.source}</span></div><div class="field"><label>来源报告做种</label><span>${r.seeds.toLocaleString('en-US')}</span></div><div class="field"><label>发布时间</label><span>${r.date}</span></div><div class="field"><label>编码 / 格式</label><span>${r.codec}</span></div></div><details class="filename" id="full-filename"><summary>完整文件名${icon('chevron')}</summary><p>${r.file}</p></details><div class="source-note"><span>来源说明</span><p>${r.source} · 此处为虚构示例来源。正式版展示当前条目的原始来源与元数据差异，不再放进更多菜单。</p></div></div><div class="detail-actions"><button class="primary" id="primary-action">${icon(video?'play':'download')}${video?(ready?'播放':'试播'):'交给下载软件'}</button><div class="secondary-row"><button class="secondary" id="download-action">${icon('download')}下载软件打开</button><button class="secondary" id="copy-link-action">${icon('copy')}复制链接</button></div><p class="detail-footnote">${video?'双击资源也可试播 · 这里仅演示交互':'这里只演示操作，不下载任何文件'}</p></div>`;$('#primary-action').onclick=()=>openPlayer(r);$('#download-action').onclick=()=>toast('概念预览：正式版会调用你的下载软件；本次没有下载。');$('#copy-link-action').onclick=()=>toast('预览：正式版复制当前资源链接，不调用下载软件。');$$('[data-row]').forEach(b=>b.ondblclick=()=>openPlayer(rows.find(r=>r.id===Number(b.dataset.row))));}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3400);}
function reset(){mode='ready';$('#preview-state').value='ready';committedQuery='远山';$('#search-input').value='远山';$('#category-filter').value='all';$('#resolution-filter').value='all';$('#resolution-filter').disabled=false;sizeFilter='all';liveOnly=false;sortField=null;$$('[data-sort]').forEach(b=>b.classList.remove('sorted'));render();}
function openDialog(title,body,footer=''){returnFocus=document.activeElement;$('#more-menu').hidden=true;$('#modal-dialog').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-button" id="dialog-close" aria-label="关闭弹层">${icon('close')}</button></div>${body}${footer}`;$('#modal-overlay').hidden=false;$('#dialog-close').onclick=closeDialog;$('#dialog-close').focus();}
function closeDialog(){$('#modal-overlay').hidden=true;returnFocus?.focus();}
function openPlayer(row){toast(row&&row.category!=='video'?'预览：交给下载软件。':'沿用已安装软件的播放器，本次不重做播放器，也不从网页预览启动播放。');}
$('#search-form').onsubmit=e=>{e.preventDefault();committedQuery=$('#search-input').value.trim();render();toast('已筛选本地示例数据，未向搜索源发送请求。')};$('#search-nav').onclick=()=>$('#search-input').focus();$('#preview-state').onchange=e=>{mode=e.target.value;render()};$('#category-filter').onchange=()=>{const video=['all','video'].includes($('#category-filter').value);$('#resolution-filter').disabled=!video;if(!video)$('#resolution-filter').value='all';render()};$('#resolution-filter').onchange=render;
$$('[data-sort]').forEach(button=>button.onclick=()=>{const key=button.dataset.sort;ascending=sortField===key?!ascending:false;sortField=key;$$('[data-sort]').forEach(b=>{b.classList.toggle('sorted',b===button);b.querySelector('.sort-arrow').textContent=ascending?'↑':'↓'});render()});
$('#filter-button').onclick=()=>{openDialog('筛选结果','<p class="description">少一点干扰，更快找到合适的版本。</p><div class="section-title">文件大小</div><div class="segmented" id="size-options"><button data-size="all">不限</button><button data-size="small">小于 1 GB</button><button data-size="medium">1–10 GB</button><button data-size="large">10 GB 以上</button></div><label class="check-setting"><input type="checkbox" id="live-only">仅显示来源报告有做种的结果</label>','<div class="dialog-footer"><button class="quiet-button" id="clear-filters">清除</button><button class="primary" id="apply-filters">应用筛选</button></div>');let pending=sizeFilter;$$('[data-size]').forEach(b=>{b.classList.toggle('selected',b.dataset.size===pending);b.onclick=()=>{pending=b.dataset.size;$$('[data-size]').forEach(x=>x.classList.toggle('selected',x===b))}});$('#live-only').checked=liveOnly;$('#apply-filters').onclick=()=>{sizeFilter=pending;liveOnly=$('#live-only').checked;closeDialog();render()};$('#clear-filters').onclick=()=>{sizeFilter='all';liveOnly=false;closeDialog();render()};};
const settings={tray:true,minimize:false,motion:false};
$('#settings-button').onclick=()=>{openDialog('设置',
'<div class="settings-brand"><img src="../../src/Afmc.Find.App/Assets/afmc-find.png" alt="AFMC FIND Logo"><b>AFMC FIND</b><img class="family-mark" src="../../src/Afmc.Find.App/Assets/family-mark.png" alt="家族标志"></div><p class="description">让工具安静地配合你的习惯。</p><div class="settings-card">'+
[['tray','关闭后留在托盘','从托盘图标回到当前搜索。'],['minimize','最小化时收起到托盘','关闭后，最小化仍保留在任务栏。'],['motion','减少动态效果','关闭淡入与细微过渡。']].map(([key,title,hint])=>'<div class="setting-row"><div class="setting-text"><strong>'+title+'</strong><p>'+hint+'</p></div><button role="switch" aria-label="'+title+'" class="switch" data-setting="'+key+'"><span></span></button></div>').join('')+'</div><p class="brand-phrase">Find the You<span>.</span></p><p class="description">有建议，或遇到问题，欢迎联系。</p><p class="feedback-mail">keyouchen16@gmail.com</p><button id="copy-feedback" class="secondary">复制邮箱</button><p class="modal-text">设置仅影响预览，不会修改软件配置。</p>',
'<div class="dialog-footer"><button class="primary" id="settings-done">完成预览</button></div>');$$('[data-setting]').forEach(b=>{b.setAttribute('aria-checked',String(settings[b.dataset.setting]));b.onclick=()=>{const key=b.dataset.setting;settings[key]=!settings[key];b.setAttribute('aria-checked',String(settings[key]));document.body.classList.toggle('reduce-motion',settings.motion)}});$('#settings-done').onclick=closeDialog;$('#copy-feedback').onclick=()=>navigator.clipboard.writeText('keyouchen16@gmail.com').then(()=>toast('邮箱已复制')).catch(()=>toast('邮箱：keyouchen16@gmail.com'));};
$('#sources-button').onclick=()=>location.href='sources.html';$('#player-button').onclick=()=>openPlayer();$('#feedback-button').onclick=()=>openDialog('反馈与联系','<p class="description">你的建议，让下一版更好用。</p><p class="modal-text">keyouchen16@gmail.com</p><p class="modal-text">这里仅展示反馈入口，不会发送邮件。</p>');
$$('[data-window-action]').forEach(b=>b.onclick=()=>toast('这里是窗口控件的视觉示意，正式软件保留 Windows 操作习惯。'));$$('[data-menu]').forEach(b=>b.onclick=()=>{const action=b.dataset.menu;$('#more-menu').hidden=true;$('#more-button')?.setAttribute('aria-expanded','false');if(action==='copy')toast('概念预览：资源信息复制操作示意，未写入剪贴板。');if(action==='link')openDialog('来源说明','<p class="description">本页面全部资源、做种数、大小与起播状态都是用于评审的虚构示例。</p><p class="modal-text">正式版只会依据实际检测展示起播状态，来源报告的做种数不能代替播放验证。</p>');if(action==='versions')toast('已在列表中展示多个示例版本；点击行可切换详情。')});
document.addEventListener('click',e=>{if(!e.target.closest('#more-menu')&&!e.target.closest('#more-button')){$('#more-menu').hidden=true;$('#more-button')?.setAttribute('aria-expanded','false')}});$('#modal-overlay').onclick=e=>{if(e.target===$('#modal-overlay'))closeDialog()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#modal-overlay').hidden)closeDialog();$('#search-input').focus();$('#search-input').select()}if(e.key==='Escape'){if(!$('#modal-overlay').hidden)closeDialog();$('#more-menu').hidden=true;$('#more-button')?.setAttribute('aria-expanded','false')}if(e.key==='Tab'&&!$('#modal-overlay').hidden){const controls=$$('#modal-dialog button,#modal-dialog input,#modal-dialog select').filter(n=>!n.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
